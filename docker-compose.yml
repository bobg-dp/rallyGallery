services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rally
    ports:
      - "5433:5432"
    volumes:
      - rally_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d rally"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  rally_pg:
